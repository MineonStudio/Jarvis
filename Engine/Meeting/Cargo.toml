[package]
name = "jarvis-meeting-engine"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
bzip2 = "0.6.1"
faer = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
tar = "0.4"

[profile.release]
strip = true
