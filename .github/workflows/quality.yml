name: Swift quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: macos-26
    env:
      JARVIS_WARNINGS_AS_ERRORS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure build workspace
        run: echo "JARVIS_SWIFTPM_SCRATCH_DIR=$RUNNER_TEMP/jarvis-swiftpm" >> "$GITHUB_ENV"

      - name: Install static-analysis tools
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then brew install swiftlint; fi
          # macos-26 already has SwiftFormat 0.63.0 and brew install will not
          # replace it. 0.63.0 and 0.63.1 disagree on doc comments; this repo
          # is formatted with 0.63.1.
          curl -fsSL -o /tmp/swiftformat.zip -L https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat.zip
          rm -rf /tmp/swiftformat-0.63.1
          mkdir -p /tmp/swiftformat-0.63.1
          unzip -o /tmp/swiftformat.zip -d /tmp/swiftformat-0.63.1
          chmod +x /tmp/swiftformat-0.63.1/swiftformat
          echo "/tmp/swiftformat-0.63.1" >> "$GITHUB_PATH"
          /tmp/swiftformat-0.63.1/swiftformat --version

      - name: SwiftFormat check
        run: |
          swiftformat --version
          test "$(swiftformat --version)" = "0.63.1"
          swiftformat --lint --config .swiftformat Sources Tests

      - name: SwiftLint check
        # Preserve existing debt while rejecting every new warning or error.
        run: swiftlint lint --config .swiftlint.yml --baseline .swiftlint-baseline.json --strict

      - name: Build
        run: swift build -c release --scratch-path "$JARVIS_SWIFTPM_SCRATCH_DIR" -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --scratch-path "$JARVIS_SWIFTPM_SCRATCH_DIR" -Xswiftc -warnings-as-errors

      - name: Package app bundle
        run: |
          export JARVIS_SIGNING_KEYCHAIN="$RUNNER_TEMP/jarvis-ci.keychain-db"
          signing_password="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_password"
          trap 'security delete-keychain "$JARVIS_SIGNING_KEYCHAIN"' EXIT
          security create-keychain -p "$signing_password" "$JARVIS_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$signing_password" "$JARVIS_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$JARVIS_SIGNING_KEYCHAIN"
          ./script/setup_signing.sh --development
          security set-key-partition-list -S apple-tool:,apple: -s -k "$signing_password" "$JARVIS_SIGNING_KEYCHAIN" >/dev/null
          JARVIS_DEV_BUILD=1 ./build_app.sh

      - name: Check packaged identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Jarvis-Dev.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Jarvis-Dev.app/Contents/Info.plist
          test -f dist/Jarvis-Dev.app/Contents/Resources/Assets.car
          codesign -d --entitlements - dist/Jarvis-Dev.app >/dev/null

      - name: Check diff whitespace
        run: git diff --check
